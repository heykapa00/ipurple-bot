name: iPurple Monitor

on:
  schedule:
    # co 15 minut - dla PRYWATNEGO repo lepiej zwiekszyc do co 20-30 min
    # (darmowy limit GitHub Actions dla prywatnych repo to 2000 min/miesiac;
    # publiczne repo ma nielimitowane minuty)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # pozwala tez uruchomic recznie z zakladki "Actions"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Uruchom sprawdzenie sklepu
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ipurple_monitor.py --once

      - name: Zapisz zaktualizowany stan (ipurple_state.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipurple_state.json
          git diff --staged --quiet || git commit -m "Aktualizacja stanu monitora [skip ci]"
          git push
