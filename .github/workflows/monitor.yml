name: iPurple Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb uruchomienia"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - seed

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Uruchom sprawdzenie sklepu
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "seed" ]; then
            python ipurple_monitor.py --seed
          else
            python ipurple_monitor.py --once
          fi

      - name: Zapisz zaktualizowany stan (ipurple_state.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipurple_state.json
          git diff --staged --quiet || git commit -m "Aktualizacja stanu monitora [skip ci]"
          git push
