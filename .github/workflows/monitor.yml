name: iPurple Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb uruchomienia"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - seed

permissions:
  contents: write   # potrzebne do pusha stanu

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Uruchom sprawdzenie sklepu
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "seed" ]; then
            python ipurple_monitor.py --seed
          else
            python ipurple_monitor.py --once
          fi

      - name: Zapisz zaktualizowany stan do repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipurple_state.json || true
          if git diff --staged --quiet; then
            echo "Brak zmian w stanie – nic nie commit'uję"
          else
            git commit -m "Update iPurple state [skip ci]"
            git push
          fi
